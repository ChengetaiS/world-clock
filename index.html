<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.0/moment-timezone-with-data-1970-2030.min.js"></script>
    <title>World Clock</title>
  </head>
  <body>
    <div class="container">
      <h1 class="world-clock">World Clock</h1>

      <select name="" id="city-selector">
        <option value="">Select city...</option>
        <option value="Asia/Dubai">Dubai</option>
        <option value="Africa/Addis_Ababa">Addis Ababa</option>
        <option value="Cuba">Cuba</option>
      </select>

      <div class="cities" id="cities">
        <div class="city" id="harare">
          <div class="info">
            <h2>Harare</h2>
            <div class="date">Friday, 03 October, 2025</div>
          </div>
          <div class="time">14:24 <small>PM</small></div>
        </div>

        <div class="city" id="fiji">
          <div class="info">
            <h2>Fiji</h2>
            <div class="date">Friday, 03 October, 2025</div>
          </div>
          <div class="time">14:24 <small>PM</small></div>
        </div>

        <div class="city" id="new-york">
          <div class="info">
            <h2>New York</h2>
            <div class="date">Friday, 03 October, 2025</div>
          </div>
          <div class="time">14:24 <small>PM</small></div>
        </div>
      </div>
    </div>
    <footer>
      This project was coded by
      <a href="https://github.com/ChengetaiS" target="_blank"
        >Chengetai.B Sibanda</a
      >
      and is open-sourced on
      <a href="https://github.com/ChengetaiS/world-clock" target="_blank"
        >GitHub</a
      >.
    </footer>
  </body>
  <script src="src/index.js"></script>
</html>
